<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bagikan Lokasi Saya</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;color:#1f2937}
.container{max-width:520px;margin:auto;padding:24px 16px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{text-align:center}
.info{background:#eef6ff;padding:14px;border-radius:12px;line-height:1.5}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;font-size:16px;font-weight:bold}
#locateBtn{background:#2563eb;color:#fff}
#shareBtn{background:#16a34a;color:#fff;display:none}
#copyBtn{background:#e5e7eb;color:#111827;display:none}
#status{margin-top:18px;padding:14px;border-radius:12px;background:#f8fafc}
.coords{display:none;margin-top:14px;padding:14px;background:#f1f5f9;border-radius:12px;word-break:break-word}
.small{font-size:13px;color:#64748b}
</style>
</head>
<body>
<div class="container"><div class="card">
<h1>📍 Bagikan Lokasi Saya</h1>
<div class="info">Lokasi hanya diakses setelah pemilik perangkat <strong>memberikan izin</strong> melalui browser.</div>
<button id="locateBtn">📍 Izinkan & Cari Lokasi Saya</button>
<button id="shareBtn">📤 Bagikan Lokasi</button>
<button id="copyBtn">📋 Salin Link Peta</button>
<div id="status">Belum ada lokasi yang dibagikan.</div>
<div id="coords" class="coords"><strong>Lokasi ditemukan:</strong><div id="coordinateText"></div><p class="small">Tautan peta:</p><a id="mapLink" href="#" target="_blank" rel="noopener">Buka di Google Maps</a></div>
<p class="small" style="text-align:center;margin-top:20px">Lokasi tidak dikirim ke server oleh halaman ini.</p>
</div></div>
<script>
const locateBtn=document.getElementById("locateBtn"),shareBtn=document.getElementById("shareBtn"),copyBtn=document.getElementById("copyBtn"),statusBox=document.getElementById("status"),coordsBox=document.getElementById("coords"),coordinateText=document.getElementById("coordinateText"),mapLink=document.getElementById("mapLink");
let mapUrl="";
locateBtn.onclick=()=>{
 if(!navigator.geolocation){statusBox.textContent="❌ Browser tidak mendukung lokasi.";return}
 statusBox.textContent="⏳ Meminta izin dan mencari lokasi...";
 navigator.geolocation.getCurrentPosition(p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude;
  mapUrl=`https://www.google.com/maps?q=${lat},${lon}`;
  coordinateText.textContent=`Latitude: ${lat.toFixed(6)} | Longitude: ${lon.toFixed(6)}`;
  mapLink.href=mapUrl;coordsBox.style.display="block";shareBtn.style.display="block";copyBtn.style.display="block";
  statusBox.textContent="✅ Lokasi ditemukan. Kamu bisa membagikannya.";
 },e=>{
  statusBox.textContent=e.code===1?"❌ Izin lokasi ditolak. Izinkan lokasi di browser.":e.code===2?"❌ Lokasi tidak tersedia. Aktifkan GPS/lokasi perangkat.":"❌ Pencarian lokasi gagal. Coba lagi.";
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
shareBtn.onclick=async()=>{
 if(!mapUrl)return;
 if(navigator.share){try{await navigator.share({title:"Lokasi Saya",text:"Ini lokasi yang saya pilih untuk dibagikan:",url:mapUrl})}catch(e){}}
 else copyMapLink();
};
copyBtn.onclick=copyMapLink;
async function copyMapLink(){if(!mapUrl)return;try{await navigator.clipboard.writeText(mapUrl);statusBox.textContent="✅ Link Google Maps berhasil disalin."}catch(e){prompt("Salin link ini:",mapUrl)}}
</script>
</body>
</html>
